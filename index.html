<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>For Panda 🐼❤️</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #180308;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(160, 20, 45, .40),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #350811 0%,
            #160307 50%,
            #3d0b15 100%
        );
}

.background::before {
    content: "";
    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 500px;
    max-height: 500px;

    left: 50%;
    top: 38%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 120, 140, .12),
            transparent 68%
        );
}


/* =========================================================
   ENVELOPE SCENE
========================================================= */

.envelope-scene {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        opacity .65s ease,
        transform .65s ease;
}


/* =========================================================
   ENVELOPE AREA
========================================================= */

.envelope-area {
    position: relative;

    width: min(560px, 84vw);

    aspect-ratio: 1.55;
}


/* =========================================================
   SHADOW
========================================================= */

.envelope-shadow {
    position: absolute;

    left: 8%;
    right: 8%;
    bottom: -25px;

    height: 35px;

    border-radius: 50%;

    background: rgba(0,0,0,.40);

    filter: blur(14px);

    z-index: 0;
}


/* =========================================================
   INITIAL ENVELOPE
========================================================= */

.envelope {
    position: absolute;
    inset: 0;

    z-index: 5;

    border-radius: 9px;

    overflow: hidden;

    background: #b51222;

    box-shadow:
        0 30px 70px rgba(0,0,0,.55);
}


/* =========================================================
   SIMPLE RED BASE
========================================================= */

.envelope-base {
    position: absolute;
    inset: 0;

    background: #b51222;
}


/* =========================================================
   SUBTLE RED ENVELOPE FOLDS
========================================================= */

.envelope-base::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            135deg,
            transparent 49.5%,
            rgba(70,0,8,.25) 50%,
            transparent 50.5%
        ),
        linear-gradient(
            225deg,
            transparent 49.5%,
            rgba(70,0,8,.25) 50%,
            transparent 50.5%
        );
}


/* =========================================================
   FRONT CONTENT
========================================================= */

.front-content {
    position: absolute;
    inset: 0;

    z-index: 20;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 30px;
}


.front-small {
    margin-bottom: 15px;

    color: rgba(255,255,255,.78);

    font-size: 12px;

    letter-spacing: 4px;

    text-transform: uppercase;
}


.front-title {
    color: white;

    font-size:
        clamp(
            27px,
            5vw,
            50px
        );

    line-height: 1.12;

    font-weight: 500;

    text-shadow:
        0 5px 20px rgba(0,0,0,.30);
}


.front-title span {
    color: #ffd0d0;
    font-style: italic;
}


.front-name {
    margin-top: 17px;

    color: #fff1f1;

    font-size:
        clamp(
            17px,
            3vw,
            24px
        );
}


.panda {
    font-size: 27px;
}


/* =========================================================
   TURNING RED CARD

   THIS IS THE IMPORTANT PART.

   We do NOT animate the original envelope.

   Instead, after clicking TURN, this simple red card
   appears and performs the fold.
========================================================= */

.turn-card {
    position: absolute;
    inset: 0;

    z-index: 50;

    background: #b51222;

    border-radius: 9px;

    opacity: 0;

    pointer-events: none;

    will-change: transform, opacity;
}


/* =========================================================
   RED CARD CENTER LINE
========================================================= */

.turn-card::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;
    bottom: 0;

    width: 2px;

    transform: translateX(-50%);

    background:
        rgba(70,0,8,.22);

    opacity: 0;
}


/* =========================================================
   TURN CARD ACTIVE
========================================================= */

.envelope.turning .turn-card {
    opacity: 1;

    animation:
        redFold
        1.15s
        cubic-bezier(.25,.75,.20,1)
        forwards;
}


.envelope.turning .turn-card::after {
    animation:
        seamFade
        1.15s
        ease
        forwards;
}


/* =========================================================
   SIMPLE RED FOLD

   No rotateY.
   No perspective.
   No filters.
   No 3D.

   Only scaleX + translateX.
========================================================= */

@keyframes redFold {

    0% {
        transform:
            translateX(0)
            scaleX(1);

        opacity: 1;
    }

    25% {
        transform:
            translateX(0)
            scaleX(.88);

        opacity: 1;
    }

    50% {
        transform:
            translateX(0)
            scaleX(.65);

        opacity: 1;
    }

    72% {
        transform:
            translateX(0)
            scaleX(.36);

        opacity: .95;
    }

    88% {
        transform:
            translateX(0)
            scaleX(.12);

        opacity: .75;
    }

    100% {
        transform:
            translateX(0)
            scaleX(.01);

        opacity: 0;
    }
}


@keyframes seamFade {

    0% {
        opacity: 0;
    }

    35% {
        opacity: .25;
    }

    55% {
        opacity: .60;
    }

    80% {
        opacity: .25;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   BACK RED CARD

   Appears after the fold.
========================================================= */

.back-card {
    position: absolute;
    inset: 0;

    z-index: 40;

    background: #b51222;

    border-radius: 9px;

    opacity: 0;

    pointer-events: none;
}


.back-card.visible {
    opacity: 1;
}


/* =========================================================
   BACK CARD SUBTLE BORDER
========================================================= */

.back-card::before {
    content: "";

    position: absolute;

    inset: 13px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 5px;
}


/* =========================================================
   OPEN BUTTON
========================================================= */

.open-button-layer {
    position: absolute;

    left: 50%;
    top: 50%;

    z-index: 100;

    transform:
        translate(-50%, -50%);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .5s ease;
}


.open-button-layer.visible {
    opacity: 1;
    pointer-events: auto;
}


.open-button {
    min-width: 140px;

    padding:
        14px 35px;

    border-radius: 50px;

    border:
        1px solid
        rgba(255,255,255,.85);

    background:
        rgba(255,255,255,.12);

    color: white;

    font-family:
        Georgia,
        serif;

    font-size: 15px;

    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);

    transition:
        transform .2s ease,
        background .2s ease;
}


.open-button:hover {
    background:
        rgba(255,255,255,.25);

    transform:
        scale(1.05);
}


.open-button:active {
    transform:
        scale(.95);
}


/* =========================================================
   TURN INSTRUCTION
========================================================= */

.turn-instruction {
    position: absolute;

    left: 50%;
    bottom: -80px;

    z-index: 120;

    width: 100%;

    transform:
        translateX(-50%);

    text-align: center;

    transition:
        opacity .35s ease;
}


.turn-button {
    border: 0;

    background: transparent;

    color:
        rgba(255,235,235,.95);

    font-family:
        Georgia,
        serif;

    font-size: 15px;

    letter-spacing: 1.3px;

    cursor: pointer;

    padding:
        10px 20px;
}


.turn-arrow {
    display: block;

    margin-bottom: 5px;

    font-size: 24px;

    animation:
        arrowBounce
        1.8s
        infinite;
}


@keyframes arrowBounce {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(6px);
    }
}


/* =========================================================
   ENVELOPE EXIT
========================================================= */

.envelope-scene.opening {
    opacity: 0;

    transform:
        scale(.94)
        translateY(15px);

    pointer-events: none;
}


/* =========================================================
   PAPER SCENE
========================================================= */

.paper-scene {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =========================================================
   LETTER PAPER
========================================================= */

.paper {
    position: relative;

    width:
        min(
            760px,
            88vw
        );

    height:
        min(
            650px,
            82vh
        );

    background:
        linear-gradient(
            145deg,
            #fffdf3,
            #fff7dc
        );

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.60);

    opacity: 0;

    transform:
        translateY(180px)
        scaleY(.04);

    transform-origin:
        bottom center;

    overflow: hidden;
}


.paper.unfold {
    animation:
        paperUnfold
        1.35s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


@keyframes paperUnfold {

    0% {
        opacity: 0;

        transform:
            translateY(180px)
            scaleY(.04);
    }

    30% {
        opacity: 1;

        transform:
            translateY(85px)
            scaleY(.28);
    }

    60% {
        transform:
            translateY(30px)
            scaleY(.72);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scaleY(1);
    }
}


/* =========================================================
   PAPER BORDER
========================================================= */

.paper::before {
    content: "";

    position: absolute;

    inset: 11px;

    z-index: 30;

    border:
        1px solid
        rgba(110,70,45,.18);

    pointer-events: none;
}


/* =========================================================
   PAPER CONTENT
========================================================= */

.paper-content {
    position: relative;

    z-index: 5;

    width: 100%;
    height: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        45px
        clamp(
            27px,
            7vw,
            70px
        );

    -webkit-overflow-scrolling:
        touch;

    scrollbar-width: thin;

    color:
        #38251f;
}


.paper-content::-webkit-scrollbar {
    width: 6px;
}


.paper-content::-webkit-scrollbar-track {
    background:
        rgba(120,70,45,.07);
}


.paper-content::-webkit-scrollbar-thumb {
    background:
        rgba(120,70,45,.32);

    border-radius: 10px;
}


/* =========================================================
   LETTER HEADER
========================================================= */

.letter-header {
    text-align: center;

    margin-bottom: 35px;

    opacity: 0;
}


.paper.writing .letter-header {
    animation:
        fadeUp
        .9s
        .15s
        forwards;
}


.letter-small {
    color:
        #8c5746;

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 4px;

    margin-bottom: 12px;
}


.letter-header h1 {
    margin: 0;

    color:
        #801d2a;

    font-size:
        clamp(
            30px,
            6vw,
            50px
        );

    font-style: italic;

    font-weight: 500;
}


.letter-header p {
    margin-top: 10px;

    color:
        #765045;

    font-size: 15px;
}


/* =========================================================
   WRITEUP
========================================================= */

.writeup {
    max-width: 650px;

    margin:
        0 auto;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size:
        clamp(
            16px,
            2.15vw,
            19px
        );

    line-height:
        1.82;

    color:
        #38251f;
}


.write-paragraph {
    margin:
        0 0 24px 0;

    visibility: hidden;
}


/* =========================================================
   TYPING CURSOR
========================================================= */

.write-paragraph.typing::after {
    content: "";

    display: inline-block;

    width: 2px;

    height: 1.1em;

    margin-left: 3px;

    vertical-align: -3px;

    background:
        #801d2a;

    animation:
        blink
        .65s
        infinite;
}


@keyframes blink {

    0%,
    45% {
        opacity: 1;
    }

    46%,
    100% {
        opacity: 0;
    }
}


/* =========================================================
   FINAL LINE
========================================================= */

.final-line {
    color:
        #801d2a;

    font-size: 20px;
}


/* =========================================================
   SIGNATURE
========================================================= */

.signature {
    max-width: 650px;

    margin:
        30px auto 0;

    padding-bottom: 55px;

    text-align: right;

    color:
        #801d2a;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size: 22px;

    line-height: 1.7;

    opacity: 0;
}


.signature.show {
    animation:
        fadeUp
        1s
        forwards;
}


/* =========================================================
   HEARTS
========================================================= */

.heart {
    position: fixed;

    z-index: 500;

    pointer-events: none;

    animation:
        heartFloat
        5s
        linear
        forwards;
}


@keyframes heartFloat {

    0% {
        opacity: 0;

        transform:
            translateY(20px)
            scale(.5);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-100vh)
            scale(1.25)
            rotate(20deg);
    }
}


/* =========================================================
   GENERAL
========================================================= */

@keyframes fadeUp {

    from {
        opacity: 0;

        transform:
            translateY(20px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .envelope-area {
        width: 86vw;
    }

    .front-content {
        padding: 20px;
    }

    .front-small {
        font-size: 9px;
        letter-spacing: 2px;
    }

    .front-title {
        font-size: 27px;
    }

    .front-name {
        font-size: 16px;
    }

    .turn-instruction {
        bottom: -75px;
    }

    .turn-button {
        font-size: 13px;
    }

    .paper {
        width: 94vw;
        height: 90vh;
    }

    .paper-content {
        padding:
            38px 24px;
    }

    .letter-header h1 {
        font-size: 33px;
    }

    .letter-header p {
        font-size: 13px;
    }

    .writeup {
        font-size: 16px;
        line-height: 1.82;
    }

    .signature {
        font-size: 20px;
    }
}

</style>
</head>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const envelope =
    document.getElementById(
        "envelope"
    );

const turnButton =
    document.getElementById(
        "turnButton"
    );

const turnInstruction =
    document.getElementById(
        "turnInstruction"
    );

const openButton =
    document.getElementById(
        "openButton"
    );

const openButtonLayer =
    document.getElementById(
        "openButtonLayer"
    );

const envelopeScene =
    document.getElementById(
        "envelopeScene"
    );

const backCard =
    document.getElementById(
        "backCard"
    );

const paper =
    document.getElementById(
        "paper"
    );

const paragraphs =
    document.querySelectorAll(
        ".write-paragraph"
    );

const signature =
    document.getElementById(
        "signature"
    );


let envelopeTurned = false;
let envelopeOpened = false;


/* =========================================================
   TURN ENVELOPE
========================================================= */

turnButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();


        if (envelopeTurned) {
            return;
        }


        envelopeTurned = true;


        /*
           Hide instruction immediately.
        */

        turnInstruction.style.opacity = "0";
        turnInstruction.style.pointerEvents = "none";


        /*
           Start the simple red fold.
        */

        envelope.classList.add(
            "turning"
        );


        /*
           After the fold is completely
           finished, show the red back.
        */

        setTimeout(
            function() {

                backCard.classList.add(
                    "visible"
                );


                /*
                   Show OPEN only after
                   the animation has finished.
                */

                openButtonLayer.classList.add(
                    "visible"
                );

            },
            1180
        );

    }
);


/* =========================================================
   OPEN ENVELOPE
========================================================= */

openButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();


        if (
            !envelopeTurned ||
            envelopeOpened
        ) {
            return;
        }


        envelopeOpened = true;


        openButtonLayer.classList.remove(
            "visible"
        );


        /*
           Move envelope away.
        */

        envelopeScene.classList.add(
            "opening"
        );


        /*
           Start paper unfolding.
        */

        setTimeout(
            function() {

                paper.classList.add(
                    "unfold"
                );

            },
            300
        );


        /*
           Start writing once paper
           has opened.
        */

        setTimeout(
            function() {

                paper.classList.add(
                    "writing"
                );


                startWriting();


                createHearts();

            },
            1650
        );

    }
);


/* =========================================================
   WRITING
========================================================= */

async function startWriting() {

    await sleep(650);


    for (
        let i = 0;
        i < paragraphs.length;
        i++
    ) {

        await typeParagraph(
            paragraphs[i]
        );


        await sleep(550);

    }


    signature.classList.add(
        "show"
    );

}


/* =========================================================
   TYPEWRITER
========================================================= */

function typeParagraph(element) {

    return new Promise(
        function(resolve) {

            const text =
                element.dataset.text;


            element.style.visibility =
                "visible";


            element.classList.add(
                "typing"
            );


            let index = 0;


            function writeCharacter() {

                if (
                    index >=
                    text.length
                ) {

                    element.classList.remove(
                        "typing"
                    );


                    resolve();

                    return;
                }


                const character =
                    text[index];


                if (
                    character === "\n"
                ) {

                    element.innerHTML +=
                        "<br>";

                } else {

                    element.appendChild(
                        document.createTextNode(
                            character
                        )
                    );

                }


                index++;


                /*
                   Handwriting-like speed.
                */

                let delay = 24;


                if (
                    character === " "
                ) {

                    delay = 7;

                }


                if (
                    character === "." ||
                    character === "!" ||
                    character === "?" ||
                    character === ","
                ) {

                    delay = 115;

                }


                if (
                    character === "—"
                ) {

                    delay = 90;

                }


                setTimeout(
                    writeCharacter,
                    delay
                );

            }


            writeCharacter();

        }
    );

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }
    );

}


/* =========================================================
   FLOATING HEARTS
========================================================= */

function createHearts() {

    const symbols = [
        "❤️",
        "💕",
        "💗",
        "✨",
        "🌸",
        "🐼"
    ];


    for (
        let i = 0;
        i < 16;
        i++
    ) {

        setTimeout(
            function() {

                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "heart";


                heart.textContent =
                    symbols[
                        Math.floor(
                            Math.random() *
                            symbols.length
                        )
                    ];


                heart.style.left =
                    (
                        Math.random() * 100
                    ) + "vw";


                heart.style.bottom =
                    "-25px";


                heart.style.fontSize =
                    (
                        14 +
                        Math.random() * 16
                    ) + "px";


                heart.style.animationDuration =
                    (
                        4 +
                        Math.random() * 2
                    ) + "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    function() {

                        heart.remove();

                    },
                    7000
                );


            },
            i * 180
        );

    }

}

</script>
