<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>For Panda 🐼❤️</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background: #180308;
}


/* =========================================================
   FIXED BACKGROUND
========================================================= */

.background {
    position: fixed;

    inset: 0;

    z-index: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(160, 20, 45, .40),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #350811 0%,
            #160307 50%,
            #3d0b15 100%
        );
}


/* =========================================================
   SMALL DECORATIVE LIGHT
========================================================= */

.background::before {
    content: "";

    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 500px;
    max-height: 500px;

    left: 50%;
    top: 38%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 120, 140, .12),
            transparent 68%
        );
}


/* =========================================================
   ENVELOPE SCENE
========================================================= */

.envelope-scene {
    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:
        opacity .7s ease,
        transform .7s ease;
}


/* =========================================================
   ENVELOPE AREA
========================================================= */

.envelope-area {
    position: relative;

    width:
        min(
            560px,
            84vw
        );

    aspect-ratio: 1.55;
}


/* =========================================================
   ENVELOPE SHADOW
========================================================= */

.envelope-shadow {
    position: absolute;

    left: 8%;
    right: 8%;

    bottom: -25px;

    height: 35px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.40);

    filter:
        blur(16px);

    z-index: 0;
}


/* =========================================================
   ENVELOPE
========================================================= */

.envelope {
    position: absolute;

    inset: 0;

    z-index: 5;

    border-radius: 9px;

    overflow: hidden;

    box-shadow:
        0 30px 70px
        rgba(0,0,0,.55);
}


/* =========================================================
   ENVELOPE BACK BASE
========================================================= */

.envelope-back-base {
    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            145deg,
            #8c0915,
            #cf1c2b 50%,
            #750610
        );

    z-index: 1;
}


/* =========================================================
   BACK FOLDS
========================================================= */

.envelope-back-base::before,
.envelope-back-base::after {

    content: "";

    position: absolute;

    bottom: 0;

    width: 70%;
    height: 75%;

    background:
        rgba(70,0,8,.16);
}

.envelope-back-base::before {

    left: 0;

    clip-path:
        polygon(
            0 100%,
            100% 0,
            0 0
        );
}

.envelope-back-base::after {

    right: 0;

    clip-path:
        polygon(
            100% 100%,
            0 0,
            100% 0
        );
}


/* =========================================================
   FRONT ENVELOPE
========================================================= */

.envelope-front {
    position: absolute;

    inset: 0;

    z-index: 10;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #900914,
            #d21d2d 50%,
            #760610
        );
}


/* =========================================================
   FRONT LIGHT
========================================================= */

.envelope-front::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,.16),
            transparent 55%
        );

    pointer-events: none;
}


/* =========================================================
   FRONT LOWER FOLD
========================================================= */

.envelope-front::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 58%;

    background:
        linear-gradient(
            135deg,
            transparent 49.5%,
            rgba(70,0,8,.38) 50%,
            transparent 50.5%
        ),
        linear-gradient(
            225deg,
            transparent 49.5%,
            rgba(70,0,8,.38) 50%,
            transparent 50.5%
        );

    pointer-events: none;
}


/* =========================================================
   FRONT CONTENT
========================================================= */

.front-content {

    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 30px;
}


.front-small {

    margin-bottom: 15px;

    color:
        rgba(255,255,255,.78);

    font-size: 12px;

    letter-spacing: 4px;

    text-transform: uppercase;
}


.front-title {

    color: white;

    font-size:
        clamp(
            27px,
            5vw,
            50px
        );

    line-height: 1.12;

    font-weight: 500;

    text-shadow:
        0 5px 20px
        rgba(0,0,0,.30);
}


.front-title span {

    color:
        #ffd0d0;

    font-style: italic;
}


.front-name {

    margin-top: 17px;

    color:
        #fff1f1;

    font-size:
        clamp(
            17px,
            3vw,
            24px
        );
}


.panda {

    font-size: 27px;
}


/* =========================================================
   TWO FOLDING HALVES

   THESE ARE THE IMPORTANT PART.

   Instead of transforming the complete envelope,
   we divide the FRONT into LEFT and RIGHT pieces.
========================================================= */

.fold-left,
.fold-right {

    position: absolute;

    top: 0;
    bottom: 0;

    width: 50%;

    z-index: 30;

    background:
        linear-gradient(
            145deg,
            #900914,
            #d21d2d 50%,
            #760610
        );

    overflow: hidden;

    transform-origin: center center;

    will-change:
        transform,
        opacity;
}


/* LEFT */

.fold-left {

    left: 0;

    border-radius:
        9px 0 0 9px;
}


/* RIGHT */

.fold-right {

    right: 0;

    border-radius:
        0 9px 9px 0;
}


/* =========================================================
   FOLD HALF SHADING
========================================================= */

.fold-left::after,
.fold-right::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;
}


.fold-left::after {

    background:
        linear-gradient(
            to right,
            transparent 55%,
            rgba(0,0,0,.20)
        );
}


.fold-right::after {

    background:
        linear-gradient(
            to left,
            transparent 55%,
            rgba(0,0,0,.20)
        );
}


/* =========================================================
   FOLD CENTER SEAM
========================================================= */

.fold-seam {

    position: absolute;

    left: 50%;

    top: 0;
    bottom: 0;

    width: 2px;

    z-index: 60;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.25),
            rgba(70,0,8,.45),
            rgba(255,255,255,.20),
            transparent
        );

    opacity: 0;
}


/* =========================================================
   TURN ANIMATION
========================================================= */

.envelope.turning .fold-left {

    animation:
        foldLeft
        1.25s
        cubic-bezier(
            .22,
            .75,
            .20,
            1
        )
        forwards;
}


.envelope.turning .fold-right {

    animation:
        foldRight
        1.25s
        cubic-bezier(
            .22,
            .75,
            .20,
            1
        )
        forwards;
}


.envelope.turning .fold-seam {

    animation:
        seamAnimation
        1.25s
        ease
        forwards;
}


/* =========================================================
   LEFT FOLD

   Compresses towards the center.
========================================================= */

@keyframes foldLeft {

    0% {

        transform:
            translateX(0)
            scaleX(1);

        opacity: 1;
    }

    22% {

        transform:
            translateX(4%)
            scaleX(.82);

        opacity: 1;
    }

    45% {

        transform:
            translateX(12%)
            scaleX(.58);

        opacity: 1;
    }

    65% {

        transform:
            translateX(18%)
            scaleX(.32);

        opacity: .85;
    }

    82% {

        transform:
            translateX(24%)
            scaleX(.12);

        opacity: .35;
    }

    100% {

        transform:
            translateX(25%)
            scaleX(.01);

        opacity: 0;
    }
}


/* =========================================================
   RIGHT FOLD
========================================================= */

@keyframes foldRight {

    0% {

        transform:
            translateX(0)
            scaleX(1);

        opacity: 1;
    }

    22% {

        transform:
            translateX(-4%)
            scaleX(.82);

        opacity: 1;
    }

    45% {

        transform:
            translateX(-12%)
            scaleX(.58);

        opacity: 1;
    }

    65% {

        transform:
            translateX(-18%)
            scaleX(.32);

        opacity: .85;
    }

    82% {

        transform:
            translateX(-24%)
            scaleX(.12);

        opacity: .35;
    }

    100% {

        transform:
            translateX(-25%)
            scaleX(.01);

        opacity: 0;
    }
}


/* =========================================================
   SEAM
========================================================= */

@keyframes seamAnimation {

    0% {

        opacity: 0;

        transform:
            translateX(-50%)
            scaleY(.2);
    }

    30% {

        opacity: .35;

        transform:
            translateX(-50%)
            scaleY(.55);
    }

    55% {

        opacity: .75;

        transform:
            translateX(-50%)
            scaleY(1);
    }

    75% {

        opacity: .30;
    }

    100% {

        opacity: 0;
    }
}


/* =========================================================
   TURN INSTRUCTION
========================================================= */

.turn-instruction {

    position: absolute;

    left: 50%;

    bottom: -80px;

    z-index: 100;

    width: 100%;

    transform:
        translateX(-50%);

    text-align: center;

    transition:
        opacity .4s ease;
}


.turn-button {

    border: 0;

    background:
        transparent;

    color:
        rgba(255,235,235,.95);

    font-family:
        Georgia,
        serif;

    font-size: 15px;

    letter-spacing: 1.3px;

    cursor: pointer;

    padding:
        10px 20px;
}


.turn-arrow {

    display: block;

    margin-bottom: 5px;

    font-size: 24px;

    animation:
        arrowBounce
        1.8s
        infinite;
}


@keyframes arrowBounce {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(6px);
    }
}


/* =========================================================
   OPEN BUTTON
========================================================= */

.open-button-layer {

    position: absolute;

    left: 50%;
    top: 50%;

    z-index: 150;

    transform:
        translate(-50%, -50%);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .6s ease;
}


.open-button-layer.visible {

    opacity: 1;

    pointer-events: auto;
}


.open-button {

    min-width: 140px;

    padding:
        14px 35px;

    border-radius: 50px;

    border:
        1px solid
        rgba(255,255,255,.80);

    background:
        rgba(255,255,255,.16);

    color: white;

    font-family:
        Georgia,
        serif;

    font-size: 15px;

    letter-spacing: 3px;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);
}


.open-button:hover {

    background:
        rgba(255,255,255,.28);

    transform:
        scale(1.05);
}


.open-button:active {

    transform:
        scale(.95);
}


/* =========================================================
   ENVELOPE EXIT
========================================================= */

.envelope-scene.opening {

    opacity: 0;

    transform:
        scale(.90)
        translateY(20px);

    pointer-events: none;
}


/* =========================================================
   LETTER SCENE
========================================================= */

.paper-scene {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =========================================================
   PAPER
========================================================= */

.paper {

    position: relative;

    width:
        min(
            760px,
            88vw
        );

    height:
        min(
            650px,
            82vh
        );

    background:
        linear-gradient(
            145deg,
            #fffdf3,
            #fff7dc
        );

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.60);

    opacity: 0;

    transform:
        translateY(180px)
        scaleY(.04);

    transform-origin:
        bottom center;

    overflow: hidden;
}


.paper.unfold {

    animation:
        paperUnfold
        1.35s
        cubic-bezier(
            .16,
            1,
            .3,
            1
        )
        forwards;
}


@keyframes paperUnfold {

    0% {

        opacity: 0;

        transform:
            translateY(180px)
            scaleY(.04);
    }

    30% {

        opacity: 1;

        transform:
            translateY(85px)
            scaleY(.28);
    }

    60% {

        transform:
            translateY(30px)
            scaleY(.72);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scaleY(1);
    }
}


/* =========================================================
   PAPER BORDER
========================================================= */

.paper::before {

    content: "";

    position: absolute;

    inset: 11px;

    z-index: 30;

    border:
        1px solid
        rgba(110,70,45,.18);

    pointer-events: none;
}


/* =========================================================
   PAPER CONTENT
========================================================= */

.paper-content {

    position: relative;

    z-index: 5;

    width: 100%;
    height: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        45px
        clamp(
            27px,
            7vw,
            70px
        );

    -webkit-overflow-scrolling:
        touch;

    scrollbar-width: thin;

    color:
        #38251f;
}


.paper-content::-webkit-scrollbar {
    width: 6px;
}


.paper-content::-webkit-scrollbar-track {

    background:
        rgba(120,70,45,.07);
}


.paper-content::-webkit-scrollbar-thumb {

    background:
        rgba(120,70,45,.32);

    border-radius: 10px;
}


/* =========================================================
   LETTER HEADER
========================================================= */

.letter-header {

    text-align: center;

    margin-bottom: 35px;

    opacity: 0;
}


.paper.writing
.letter-header {

    animation:
        fadeUp
        .9s
        .15s
        forwards;
}


.letter-small {

    color:
        #8c5746;

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 4px;

    margin-bottom: 12px;
}


.letter-header h1 {

    margin: 0;

    color:
        #801d2a;

    font-size:
        clamp(
            30px,
            6vw,
            50px
        );

    font-style: italic;

    font-weight: 500;
}


.letter-header p {

    margin-top: 10px;

    color:
        #765045;

    font-size: 15px;
}


/* =========================================================
   WRITEUP
========================================================= */

.writeup {

    max-width: 650px;

    margin:
        0 auto;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size:
        clamp(
            16px,
            2.15vw,
            19px
        );

    line-height:
        1.82;

    color:
        #38251f;
}


.write-paragraph {

    margin:
        0 0 24px 0;

    visibility: hidden;
}


/* =========================================================
   TYPING CURSOR
========================================================= */

.write-paragraph.typing::after {

    content: "";

    display: inline-block;

    width: 2px;

    height: 1.1em;

    margin-left: 3px;

    vertical-align: -3px;

    background:
        #801d2a;

    animation:
        blink
        .65s
        infinite;
}


@keyframes blink {

    0%,
    45% {
        opacity: 1;
    }

    46%,
    100% {
        opacity: 0;
    }
}


/* =========================================================
   FINAL PARAGRAPH
========================================================= */

.final-line {

    color:
        #801d2a;

    font-size: 20px;
}


/* =========================================================
   SIGNATURE
========================================================= */

.signature {

    max-width: 650px;

    margin:
        30px auto 0;

    padding-bottom: 55px;

    text-align: right;

    color:
        #801d2a;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size: 22px;

    line-height: 1.7;

    opacity: 0;
}


.signature.show {

    animation:
        fadeUp
        1s
        forwards;
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.heart {

    position: fixed;

    z-index: 500;

    pointer-events: none;

    animation:
        heartFloat
        5s
        linear
        forwards;
}


@keyframes heartFloat {

    0% {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.5);
    }

    15% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-100vh)
            scale(1.25)
            rotate(20deg);
    }
}


/* =========================================================
   GENERAL
========================================================= */

@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(20px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .envelope-area {

        width: 86vw;
    }


    .front-content {

        padding: 20px;
    }


    .front-small {

        font-size: 9px;

        letter-spacing: 2px;
    }


    .front-title {

        font-size: 27px;
    }


    .front-name {

        font-size: 16px;
    }


    .turn-instruction {

        bottom: -75px;
    }


    .turn-button {

        font-size: 13px;
    }


    .paper {

        width: 94vw;

        height: 90vh;
    }


    .paper-content {

        padding:
            38px 24px;
    }


    .letter-header h1 {

        font-size: 33px;
    }


    .letter-header p {

        font-size: 13px;
    }


    .writeup {

        font-size: 16px;

        line-height: 1.82;
    }


    .signature {

        font-size: 20px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     FIXED BACKGROUND
===================================================== -->

<div class="background"></div>


<!-- =====================================================
     ENVELOPE
===================================================== -->

<div
    class="envelope-scene"
    id="envelopeScene"
>

    <div
        class="envelope-area"
    >

        <div
            class="envelope-shadow"
        ></div>


        <div
            class="envelope"
            id="envelope"
        >


            <!-- BACK -->

            <div
                class="envelope-back-base"
            ></div>


            <!-- FRONT -->

            <div
                class="envelope-front"
            >

                <div
                    class="front-content"
                >

                    <div
                        class="front-small"
                    >
                        A little something for you...
                    </div>


                    <div
                        class="front-title"
                    >

                        Happiest Birthday<br>

                        to the amazing

                        <span>
                            UX Lead
                        </span>

                    </div>


                    <div
                        class="front-name"
                    >

                        Pranati Vahia
                        aka Panda

                        <span
                            class="panda"
                        >
                            🐼❤️
                        </span>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 LEFT FOLD
            ================================================== -->

            <div
                class="fold-left"
            ></div>


            <!-- =================================================
                 RIGHT FOLD
            ================================================== -->

            <div
                class="fold-right"
            ></div>


            <!-- CENTER SEAM -->

            <div
                class="fold-seam"
            ></div>


        </div>


        <!-- =================================================
             TURN BUTTON
        ================================================== -->

        <div
            class="turn-instruction"
            id="turnInstruction"
        >

            <button
                type="button"
                class="turn-button"
                id="turnButton"
            >

                <span
                    class="turn-arrow"
                >
                    ↓
                </span>

                Click here to turn
                & open the envelope

            </button>

        </div>


        <!-- =================================================
             OPEN BUTTON
        ================================================== -->

        <div
            class="open-button-layer"
            id="openButtonLayer"
        >

            <button
                type="button"
                class="open-button"
                id="openButton"
            >
                OPEN
            </button>

        </div>


    </div>

</div>


<!-- =====================================================
     LETTER
===================================================== -->

<div
    class="paper-scene"
>

    <div
        class="paper"
        id="paper"
    >

        <div
            class="paper-content"
        >


            <!-- HEADER -->

            <header
                class="letter-header"
            >

                <div
                    class="letter-small"
                >
                    FOR MY PANDA 🐼
                </div>


                <h1>
                    Happiest Birthday ❤️
                </h1>


                <p>
                    To the amazing UX Lead,
                    Pranati Vahia aka Panda.
                </p>

            </header>


            <!-- =================================================
                 WRITEUP
            ================================================== -->

            <div
                class="writeup"
            >


                <div
                    class="write-paragraph"
                    data-text="Hey Panda — ❤️

Happiest 30th Birthday!

I know it might be a little difficult to accept that you are turning 30 and stepping into this new version of life — where there will be more responsibility, more management, more designing, lifestyle changes, fitness enthusiasm, a little more seriousness... and God knows what else!

But hey, don't stress too much."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Because you know you have Gaurav. 😎

And thank God that before 30, we met.

Because now, in your 30s, you are going to get married to me.

Cool, right? 😎😂"
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Though, as you know, I have a LOT to say.

From Haldiram and those tea-making times to today's Shozo...

This is us. ❤️

We have faced challenges, ups and downs, confusing moments, crazy moments and everything in between.

But somehow, through all of it, we still chose us."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="And luckily, we got what we wanted.

Especially you — you got what you wished for.

Although, technically, I am already the lucky one...

because I got you. ❤️"
                ></div>


                <div
                    class="write-paragraph"
                    data-text="So, koi kai b keh, kasu b ketlu pith pachhad, or modha na saame keh...

Don't stress. Don't get affected by all the negative things.

You know who you are.

You know your capabilities.

And I know them too."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Tane tari journey jaate shape kari che.

From Dev to UX, tu jaate chase karyu, jaate decisions lidha, ane pachhi ene prove pan karyu.

So no matter what people say, tane khabar che ke te shu achieve karyu che.

And I trust you.

Our manager trusts you.

Our families trust you.

LOS trusts you.

Then what else do you want?"
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Just be energetic.

Be what you are.

Hasta reh.

Because that smile... tara face par bau sari lage che, especially aa golu face par. 🥹❤️

You are a Lead, and the way you think about your department, the UX team, and the people working with you...

Seriously commendable."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Letter ma bau nai lakhvu.

I genuinely tried my best ke aa vakhte kasu navu laavu.

Pan mara pase bolva bau badhu che.

And honestly, aa badhu already bau vaar kahi chukyo chu.

So, let's keep some things for the conversations, the fights, the trips, the random food plans, and all the years ahead."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="But this one is special.

Just before our marriage, officially from your boyfriend...

One last 17th August.

And yes...

2026.

Because in 2027, I will be saying this officially as your husband.

:P"
                ></div>


                <div
                    class="write-paragraph"
                    data-text="So yes...

Please annoy me.

Vaad khech.

Heran kar.

Gusse tha.

Irritate tha mara thi.

Mane sushi khavdaay.

Ramen kha.

Badhu j kar.

Because hu have sathe hois. ❤️

And we still have so many trips to take, so many places to explore, so much food to eat, and so many memories to make.

So enjoy all of it."
                ></div>


                <div
                    class="write-paragraph final-line"
                    data-text="Enjoy your special day, cutie. ❤️

I am proud of you.

Always.

And I love you.

❤️"
                ></div>


            </div>


            <!-- =================================================
                 SIGNATURE
            ================================================== -->

            <div
                class="signature"
                id="signature"
            >

                Your boyfriend,

                <br>

                <b>
                    Gaurav aka Momo 🐼❤️
                </b>

            </div>


        </div>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const envelope =
    document.getElementById(
        "envelope"
    );

const turnButton =
    document.getElementById(
        "turnButton"
    );

const turnInstruction =
    document.getElementById(
        "turnInstruction"
    );

const openButton =
    document.getElementById(
        "openButton"
    );

const openButtonLayer =
    document.getElementById(
        "openButtonLayer"
    );

const envelopeScene =
    document.getElementById(
        "envelopeScene"
    );

const paper =
    document.getElementById(
        "paper"
    );

const paragraphs =
    document.querySelectorAll(
        ".write-paragraph"
    );

const signature =
    document.getElementById(
        "signature"
    );


let envelopeTurned = false;

let envelopeOpened = false;


/* =========================================================
   TURN ENVELOPE
========================================================= */

turnButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();


        if (envelopeTurned) {
            return;
        }


        envelopeTurned = true;


        /*
           Start lightweight fold.
        */

        envelope.classList.add(
            "turning"
        );


        /*
           Remove instruction.
        */

        turnInstruction.style.opacity =
            "0";

        turnInstruction.style.pointerEvents =
            "none";


        /*
           OPEN appears after
           animation has completely finished.
        */

        setTimeout(
            function() {

                openButtonLayer.classList.add(
                    "visible"
                );

            },
            1400
        );

    }
);


/* =========================================================
   OPEN ENVELOPE
========================================================= */

openButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();


        if (
            !envelopeTurned ||
            envelopeOpened
        ) {
            return;
        }


        envelopeOpened = true;


        /*
           Hide OPEN.
        */

        openButtonLayer.classList.remove(
            "visible"
        );


        /*
           Envelope exits.
        */

        envelopeScene.classList.add(
            "opening"
        );


        /*
           Paper starts unfolding.
        */

        setTimeout(
            function() {

                paper.classList.add(
                    "unfold"
                );

            },
            350
        );


        /*
           Start writing after paper opens.
        */

        setTimeout(
            function() {

                paper.classList.add(
                    "writing"
                );


                startWriting();


                createHearts();

            },
            1700
        );

    }
);


/* =========================================================
   WRITING
========================================================= */

async function startWriting() {

    await sleep(650);


    for (
        let i = 0;
        i < paragraphs.length;
        i++
    ) {

        await typeParagraph(
            paragraphs[i]
        );


        await sleep(550);

    }


    signature.classList.add(
        "show"
    );

}


/* =========================================================
   TYPE PARAGRAPH
========================================================= */

function typeParagraph(element) {

    return new Promise(
        function(resolve) {

            const text =
                element.dataset.text;


            element.style.visibility =
                "visible";


            element.classList.add(
                "typing"
            );


            let index = 0;


            function writeCharacter() {

                if (
                    index >=
                    text.length
                ) {

                    element.classList.remove(
                        "typing"
                    );


                    resolve();

                    return;
                }


                const character =
                    text[index];


                if (
                    character ===
                    "\n"
                ) {

                    element.innerHTML +=
                        "<br>";

                } else {

                    /*
                       textContent prevents
                       accidental HTML injection.
                    */

                    element.appendChild(
                        document.createTextNode(
                            character
                        )
                    );

                }


                index++;


                /*
                   Normal writing speed.
                */

                let delay = 24;


                /*
                   Spaces are quicker.
                */

                if (
                    character === " "
                ) {

                    delay = 7;

                }


                /*
                   Natural pause after punctuation.
                */

                if (
                    character === "." ||
                    character === "!" ||
                    character === "?" ||
                    character === ","
                ) {

                    delay = 115;

                }


                if (
                    character === "—"
                ) {

                    delay = 90;

                }


                setTimeout(
                    writeCharacter,
                    delay
                );

            }


            writeCharacter();

        }
    );

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }
    );

}


/* =========================================================
   HEARTS
========================================================= */

function createHearts() {

    const symbols = [
        "❤️",
        "💕",
        "💗",
        "✨",
        "🌸",
        "🐼"
    ];


    for (
        let i = 0;
        i < 16;
        i++
    ) {

        setTimeout(
            function() {

                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "heart";


                heart.textContent =
                    symbols[
                        Math.floor(
                            Math.random() *
                            symbols.length
                        )
                    ];


                heart.style.left =
                    (
                        Math.random() *
                        100
                    )
                    +
                    "vw";


                heart.style.bottom =
                    "-25px";


                heart.style.fontSize =
                    (
                        14 +
                        Math.random() * 16
                    )
                    +
                    "px";


                heart.style.animationDuration =
                    (
                        4 +
                        Math.random() * 2
                    )
                    +
                    "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    function() {

                        heart.remove();

                    },
                    7000
                );


            },
            i * 180
        );

    }

}

</script>
