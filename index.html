<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>For Panda 🐼❤️</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background:
        radial-gradient(
            circle at center,
            #5b1720 0%,
            #26070c 55%,
            #100205 100%
        );

}


/* =========================================================
   BACKGROUND
   ========================================================= */

.background {

    position: fixed;

    inset: 0;

    z-index: 0;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(150,20,40,.45),
            transparent 55%
        ),

        linear-gradient(
            135deg,
            #350811,
            #170308 50%,
            #3c0b14
        );

    pointer-events: none;

}


.background::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 25%,
            rgba(0,0,0,.35) 100%
        );

}


/* =========================================================
   ENVELOPE SCENE
   ========================================================= */

.envelope-scene {

    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    justify-content: center;

    align-items: center;

    isolation: isolate;

    overflow: hidden;

    transition:
        opacity 1s ease,
        transform 1s ease;

}


/* =========================================================
   ENVELOPE AREA
   ========================================================= */

.envelope-area {

    position: relative;

    width:
        min(
            560px,
            84vw
        );

    aspect-ratio: 1.55;

    isolation: isolate;

}


/* =========================================================
   ENVELOPE
   ========================================================= */

.envelope {

    position: absolute;

    inset: 0;

    /*
       The important part:

       The transform is isolated ONLY
       to this element.
    */

    transform-style: preserve-3d;

    transform-origin: center center;

    transition:
        transform
        1.35s
        cubic-bezier(
            .77,
            0,
            .18,
            1
        );

}


/* =========================================================
   ENVELOPE TURN
   ========================================================= */

.envelope.turn {

    transform:
        rotateY(180deg);

}


/* =========================================================
   ENVELOPE FRONT / BACK
   ========================================================= */

.envelope-front,
.envelope-back {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    border-radius: 9px;

    backface-visibility: hidden;

    -webkit-backface-visibility: hidden;

    overflow: hidden;

    box-shadow:
        0 35px 80px
        rgba(0,0,0,.65);

}


/* =========================================================
   ENVELOPE FRONT
   ========================================================= */

.envelope-front {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 40px;

    background:

        linear-gradient(
            145deg,
            #8e0915,
            #d51c2c 50%,
            #760610
        );

}


/* Highlight */

.envelope-front::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.16),
            transparent 55%
        );

}


/* Envelope folds */

.envelope-front::after {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 58%;

    background:

        linear-gradient(
            135deg,
            transparent 49.5%,
            rgba(70,0,8,.40) 50%,
            transparent 50.5%
        ),

        linear-gradient(
            225deg,
            transparent 49.5%,
            rgba(70,0,8,.40) 50%,
            transparent 50.5%
        );

}


/* =========================================================
   FRONT TEXT
   ========================================================= */

.front-small {

    position: relative;

    z-index: 5;

    margin-bottom: 18px;

    font-size: 12px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: white;

    opacity: .78;

}


.front-title {

    position: relative;

    z-index: 5;

    color: white;

    font-size:
        clamp(
            28px,
            5vw,
            52px
        );

    line-height: 1.12;

    font-weight: 500;

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.35);

}


.front-title span {

    color: #ffd0d0;

    font-style: italic;

}


.front-name {

    position: relative;

    z-index: 5;

    margin-top: 18px;

    color: #fff2f2;

    font-size:
        clamp(
            17px,
            3vw,
            24px
        );

}


.panda {

    font-size: 28px;

}


/* =========================================================
   ENVELOPE BACK
   ========================================================= */

.envelope-back {

    transform:
        rotateY(180deg);

    background:

        linear-gradient(
            145deg,
            #8c0915,
            #ce1c2b 50%,
            #750610
        );

}


/* Envelope back folds */

.envelope-back::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            135deg,
            transparent 49.5%,
            rgba(70,0,8,.38) 50%,
            transparent 50.5%
        ),

        linear-gradient(
            225deg,
            transparent 49.5%,
            rgba(70,0,8,.38) 50%,
            transparent 50.5%
        );

}


/* =========================================================
   TURN BUTTON
   ========================================================= */

.turn-instruction {

    position: absolute;

    left: 50%;

    bottom: -78px;

    z-index: 100;

    transform:
        translateX(-50%);

    width: 100%;

    text-align: center;

    transition:
        opacity .5s ease;

}


.turn-button {

    border: none;

    background: transparent;

    color:
        rgba(255,235,235,.95);

    font-family: inherit;

    font-size: 15px;

    letter-spacing: 1.5px;

    cursor: pointer;

    padding:
        10px 20px;

}


.turn-button:hover {

    color: white;

}


.turn-arrow {

    display: block;

    margin-bottom: 4px;

    font-size: 25px;

    animation:
        bounce
        1.8s
        infinite;

}


/* =========================================================
   OPEN BUTTON
   ========================================================= */

.open-button-layer {

    position: absolute;

    left: 50%;

    top: 50%;

    z-index: 200;

    transform:
        translate(-50%, -50%);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .5s ease;

}


.open-button-layer.visible {

    opacity: 1;

    pointer-events: auto;

}


.open-button {

    border:
        1px solid
        rgba(255,255,255,.85);

    border-radius: 50px;

    padding:
        14px 38px;

    min-width: 135px;

    background:
        rgba(255,255,255,.17);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    color: white;

    font-family: inherit;

    font-size: 15px;

    letter-spacing: 3px;

    cursor: pointer;

    outline: none;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.25);

    transition:
        transform .25s ease,
        background .25s ease;

}


.open-button:hover {

    background:
        rgba(255,255,255,.32);

    transform:
        scale(1.07);

}


.open-button:active {

    transform:
        scale(.95);

}


/* =========================================================
   ENVELOPE DISAPPEARS
   ========================================================= */

.envelope-scene.opening {

    opacity: 0;

    transform:
        scale(.72)
        translateY(30px);

    pointer-events: none;

}


/* =========================================================
   LETTER SCENE
   ========================================================= */

.paper-scene {

    position: fixed;

    inset: 0;

    z-index: 30;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;

}


/* =========================================================
   LETTER
   ========================================================= */

.paper {

    position: relative;

    width:
        min(
            760px,
            88vw
        );

    height:
        min(
            650px,
            82vh
        );

    overflow: hidden;

    background:

        linear-gradient(
            145deg,
            #fffdf2,
            #fff7dc
        );

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.65);

    opacity: 0;

    transform:

        translateY(180px)
        scaleY(.05);

    transform-origin:
        bottom center;

    pointer-events: auto;

}


.paper.unfold {

    animation:
        paperUnfold
        1.6s
        cubic-bezier(
            .16,
            1,
            .3,
            1
        )
        forwards;

}


@keyframes paperUnfold {

    0% {

        opacity: 0;

        transform:
            translateY(180px)
            scaleY(.05);

    }

    30% {

        opacity: 1;

        transform:
            translateY(90px)
            scaleY(.25);

    }

    60% {

        transform:
            translateY(35px)
            scaleY(.70);

    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scaleY(1);

    }

}


/* =========================================================
   PAPER BORDER
   ========================================================= */

.paper::before {

    content: "";

    position: absolute;

    inset: 11px;

    z-index: 10;

    border:
        1px solid
        rgba(110,70,45,.18);

    pointer-events: none;

}


/* =========================================================
   PAPER CONTENT
   ========================================================= */

.paper-content {

    position: relative;

    z-index: 5;

    width: 100%;

    height: 100%;

    overflow-y: auto;

    overflow-x: hidden;

    padding:
        48px
        clamp(
            30px,
            7vw,
            70px
        );

    color:
        #38251f;

    -webkit-overflow-scrolling:
        touch;

    scrollbar-width:
        thin;

}


/* =========================================================
   SCROLLBAR
   ========================================================= */

.paper-content::-webkit-scrollbar {

    width: 6px;

}


.paper-content::-webkit-scrollbar-track {

    background:
        rgba(120,70,45,.08);

}


.paper-content::-webkit-scrollbar-thumb {

    background:
        rgba(120,70,45,.35);

    border-radius: 10px;

}


/* =========================================================
   LETTER HEADER
   ========================================================= */

.letter-header {

    text-align: center;

    margin-bottom: 38px;

    opacity: 0;

}


.paper.writing
.letter-header {

    animation:
        fadeUp
        1s
        .2s
        forwards;

}


.letter-small {

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 4px;

    color:
        #8c5746;

    margin-bottom: 12px;

}


.letter-header h1 {

    margin: 0;

    color:
        #801d2a;

    font-size:
        clamp(
            30px,
            6vw,
            50px
        );

    font-style: italic;

    font-weight: 500;

}


.letter-header p {

    margin-top: 10px;

    font-size: 15px;

    color:
        #765045;

}


/* =========================================================
   WRITEUP
   ========================================================= */

.writeup {

    position: relative;

    z-index: 20;

    max-width: 650px;

    margin: auto;

    font-family:

        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size:
        clamp(
            16px,
            2.15vw,
            19px
        );

    line-height:
        1.82;

    letter-spacing:
        .05px;

}


.write-paragraph {

    margin-bottom: 24px;

    visibility: hidden;

}


/* =========================================================
   WRITING CURSOR
   ========================================================= */

.write-paragraph.typing::after {

    content: "";

    display: inline-block;

    width: 2px;

    height: 1.15em;

    margin-left: 3px;

    vertical-align: -3px;

    background:
        #801d2a;

    animation:
        cursorBlink
        .7s
        infinite;

}


/* =========================================================
   FINAL PARAGRAPH
   ========================================================= */

.final-line {

    margin-top: 30px;

    color:
        #801d2a;

    font-size: 20px;

}


/* =========================================================
   SIGNATURE
   ========================================================= */

.signature {

    margin-top: 35px;

    padding-bottom: 50px;

    text-align: right;

    font-family:

        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size: 23px;

    line-height: 1.7;

    color:
        #801d2a;

    opacity: 0;

}


.signature.show {

    animation:
        fadeUp
        1.2s
        forwards;

}


/* =========================================================
   FLOATING HEARTS
   ========================================================= */

.heart {

    position: fixed;

    z-index: 200;

    pointer-events: none;

    animation:
        floatHeart
        5s
        linear
        forwards;

}


@keyframes floatHeart {

    0% {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.5)
            rotate(0deg);

    }

    15% {

        opacity: 1;

    }

    100% {

        opacity: 0;

        transform:
            translateY(-100vh)
            scale(1.3)
            rotate(25deg);

    }

}


/* =========================================================
   GENERAL ANIMATIONS
   ========================================================= */

@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(25px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


@keyframes bounce {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(7px);

    }

}


@keyframes cursorBlink {

    0%,
    45% {

        opacity: 1;

    }

    46%,
    100% {

        opacity: 0;

    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    /*
       IMPORTANT:

       Nothing here transforms the page,
       background or envelope scene.

       Only .envelope itself rotates.
    */

    .envelope-scene {

        transform: none !important;

    }


    .background {

        transform: none !important;

    }


    .envelope-area {

        transform: none !important;

        perspective: none;

    }


    .envelope {

        transform-style: preserve-3d;

    }


    .envelope.turn {

        transform:
            rotateY(180deg);

    }


    .envelope-front,
    .envelope-back {

        transform-style: flat;

    }


    .envelope-front {

        padding: 25px;

    }


    .front-small {

        font-size: 9px;

        letter-spacing: 2px;

    }


    .front-title {

        font-size: 28px;

    }


    .front-name {

        font-size: 16px;

    }


    .turn-instruction {

        bottom: -70px;

    }


    .turn-button {

        font-size: 13px;

    }


    .paper {

        width: 94vw;

        height: 90vh;

    }


    .paper-content {

        padding:
            40px 25px;

    }


    .writeup {

        font-size: 16px;

        line-height: 1.82;

    }


    .letter-header h1 {

        font-size: 34px;

    }


    .letter-header p {

        font-size: 13px;

    }


    .signature {

        font-size: 20px;

    }

}

</style>

</head>

<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const envelope =
    document.getElementById(
        "envelope"
    );

const turnButton =
    document.getElementById(
        "turnButton"
    );

const openButton =
    document.getElementById(
        "openButton"
    );

const openButtonLayer =
    document.getElementById(
        "openButtonLayer"
    );

const envelopeScene =
    document.getElementById(
        "envelopeScene"
    );

const turnInstruction =
    document.getElementById(
        "turnInstruction"
    );

const paper =
    document.getElementById(
        "paper"
    );

const paragraphs =
    document.querySelectorAll(
        ".write-paragraph"
    );

const signature =
    document.getElementById(
        "signature"
    );


let envelopeTurned = false;

let envelopeOpened = false;


/* =========================================================
   TURN ENVELOPE
   ========================================================= */

turnButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();


        if (envelopeTurned) {

            return;

        }


        envelopeTurned = true;


        envelope.classList.add(
            "turn"
        );


        turnInstruction.style.opacity =
            "0";

        turnInstruction.style.pointerEvents =
            "none";


        setTimeout(
            function() {

                openButtonLayer.classList.add(
                    "visible"
                );

            },
            1100
        );

    }
);


/* =========================================================
   OPEN ENVELOPE
   ========================================================= */

openButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();


        if (!envelopeTurned) {

            return;

        }


        if (envelopeOpened) {

            return;

        }


        envelopeOpened = true;


        openButtonLayer.classList.remove(
            "visible"
        );


        openButtonLayer.style.pointerEvents =
            "none";


        /*
         * Envelope leaves the screen.
         */

        envelopeScene.classList.add(
            "opening"
        );


        /*
         * Paper unfolds.
         */

        setTimeout(
            function() {

                paper.classList.add(
                    "unfold"
                );

            },
            450
        );


        /*
         * Start writing.
         */

        setTimeout(
            function() {

                paper.classList.add(
                    "writing"
                );


                startWriting();


                createHearts();

            },
            2000
        );

    }
);


/* =========================================================
   WRITING ANIMATION
   ========================================================= */

async function startWriting() {

    await sleep(700);


    for (
        let i = 0;
        i < paragraphs.length;
        i++
    ) {

        await typeParagraph(
            paragraphs[i]
        );


        await sleep(650);

    }


    signature.classList.add(
        "show"
    );

}


/* =========================================================
   TYPE PARAGRAPH
   ========================================================= */

function typeParagraph(element) {

    return new Promise(
        function(resolve) {

            const text =
                element.dataset.text;


            element.style.visibility =
                "visible";


            element.classList.add(
                "typing"
            );


            let index = 0;


            function writeCharacter() {

                if (
                    index >=
                    text.length
                ) {

                    element.classList.remove(
                        "typing"
                    );

                    resolve();

                    return;

                }


                const character =
                    text[index];


                if (
                    character ===
                    "\n"
                ) {

                    element.innerHTML +=
                        "<br>";

                }

                else {

                    element.textContent +=
                        character;

                }


                index++;


                let delay = 25;


                if (
                    character ===
                    " "
                ) {

                    delay = 8;

                }


                if (
                    character === "." ||
                    character === "," ||
                    character === "!" ||
                    character === "?" ||
                    character === "—"
                ) {

                    delay = 130;

                }


                setTimeout(
                    writeCharacter,
                    delay
                );

            }


            writeCharacter();

        }
    );

}


/* =========================================================
   SLEEP
   ========================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   HEARTS
   ========================================================= */

function createHearts() {

    const symbols = [

        "❤️",
        "💕",
        "💗",
        "✨",
        "🌸",
        "🐼"

    ];


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        setTimeout(
            function() {

                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "heart";


                heart.textContent =
                    symbols[
                        Math.floor(
                            Math.random()
                            *
                            symbols.length
                        )
                    ];


                heart.style.left =
                    Math.random()
                    *
                    100
                    +
                    "vw";


                heart.style.bottom =
                    "-30px";


                heart.style.fontSize =
                    (
                        14 +
                        Math.random() * 18
                    )
                    +
                    "px";


                heart.style.animationDuration =
                    (
                        4 +
                        Math.random() * 3
                    )
                    +
                    "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    function() {

                        heart.remove();

                    },
                    7000
                );


            },
            i * 180
        );

    }

}

</script>
