<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>For Panda 🐼❤️</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: #180408;
}


/* =========================================================
   FIXED BACKGROUND
   ========================================================= */

.background {
    position: fixed;
    inset: 0;
    z-index: 0;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(160, 20, 45, .42),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #350811,
            #160307 50%,
            #3d0b15
        );

    pointer-events: none;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 25%,
            rgba(0,0,0,.38) 100%
        );
}


/* =========================================================
   ENVELOPE SCENE
   ========================================================= */

.envelope-scene {
    position: fixed;
    inset: 0;

    z-index: 10;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    transition:
        opacity 1s ease,
        transform 1s ease;
}


/* =========================================================
   ENVELOPE AREA
   ========================================================= */

.envelope-area {
    position: relative;

    width: min(560px, 84vw);

    aspect-ratio: 1.55;
}


/* =========================================================
   ENVELOPE CARD
   ========================================================= */

.envelope-card {
    position: absolute;
    inset: 0;

    border-radius: 9px;

    overflow: hidden;

    box-shadow:
        0 35px 80px rgba(0,0,0,.65);

    /*
       IMPORTANT:
       No perspective.
       No rotateY.
       No preserve-3d.
    */

    transform-origin: center center;
}


/* =========================================================
   FRONT
   ========================================================= */

.envelope-front {
    position: absolute;
    inset: 0;

    z-index: 5;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 40px;

    background:
        linear-gradient(
            145deg,
            #8e0915,
            #d51c2c 50%,
            #760610
        );

    transform-origin: center center;
}


/* Front highlight */

.envelope-front::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.16),
            transparent 55%
        );
}


/* Front folds */

.envelope-front::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 58%;

    background:

        linear-gradient(
            135deg,
            transparent 49.5%,
            rgba(70,0,8,.40) 50%,
            transparent 50.5%
        ),

        linear-gradient(
            225deg,
            transparent 49.5%,
            rgba(70,0,8,.40) 50%,
            transparent 50.5%
        );
}


/* =========================================================
   FRONT TEXT
   ========================================================= */

.front-small {
    position: relative;
    z-index: 10;

    margin-bottom: 18px;

    font-size: 12px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: white;

    opacity: .78;
}


.front-title {
    position: relative;
    z-index: 10;

    color: white;

    font-size:
        clamp(
            28px,
            5vw,
            52px
        );

    line-height: 1.12;

    font-weight: 500;

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.35);
}


.front-title span {
    color: #ffd0d0;
    font-style: italic;
}


.front-name {
    position: relative;
    z-index: 10;

    margin-top: 18px;

    color: #fff2f2;

    font-size:
        clamp(
            17px,
            3vw,
            24px
        );
}


.panda {
    font-size: 28px;
}


/* =========================================================
   CENTER FOLD
   ========================================================= */

.center-fold {
    position: absolute;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 3px;

    z-index: 50;

    transform:
        translateX(-50%)
        scaleY(0);

    opacity: 0;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.30),
            rgba(80,0,8,.45),
            rgba(255,255,255,.18),
            transparent
        );

    box-shadow:
        0 0 15px
        rgba(0,0,0,.3);

    pointer-events: none;
}


/* =========================================================
   BACK
   ========================================================= */

.envelope-back {
    position: absolute;
    inset: 0;

    z-index: 2;

    background:
        linear-gradient(
            145deg,
            #8c0915,
            #ce1c2b 50%,
            #750610
        );

    opacity: 0;

    transform:
        scaleX(.02);

    transform-origin: center center;

    pointer-events: none;
}


/* Back folds */

.envelope-back::before {
    content: "";

    position: absolute;
    inset: 0;

    background:

        linear-gradient(
            135deg,
            transparent 49.5%,
            rgba(70,0,8,.38) 50%,
            transparent 50.5%
        ),

        linear-gradient(
            225deg,
            transparent 49.5%,
            rgba(70,0,8,.38) 50%,
            transparent 50.5%
        );
}


/* =========================================================
   TURN SHADOW
   ========================================================= */

.turn-shadow {
    position: absolute;

    inset: 0;

    z-index: 60;

    opacity: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(0,0,0,.30) 48%,
            rgba(255,255,255,.08) 50%,
            rgba(0,0,0,.30) 52%,
            transparent 100%
        );

    mix-blend-mode: multiply;
}


/* =========================================================
   SMOOTH TURN ANIMATION
   ========================================================= */

/*
   FRONT

   Instead of disappearing instantly, the envelope
   compresses toward its centre while slightly moving
   vertically. This gives the impression of paper folding.
*/

.envelope-card.turning .envelope-front {

    animation:
        paperFrontFold
        1.45s
        cubic-bezier(
            .76,
            0,
            .18,
            1
        )
        forwards;
}


@keyframes paperFrontFold {

    0% {
        transform:
            scaleX(1)
            scaleY(1)
            translateX(0);

        opacity: 1;

        filter:
            brightness(1);
    }

    18% {
        transform:
            scaleX(.94)
            scaleY(.995)
            translateX(-1%);

        opacity: 1;

        filter:
            brightness(.98);
    }

    38% {
        transform:
            scaleX(.72)
            scaleY(.985)
            translateX(-2%);

        opacity: 1;

        filter:
            brightness(.94);
    }

    56% {
        transform:
            scaleX(.43)
            scaleY(.96)
            translateX(-2%);

        opacity: .92;

        filter:
            brightness(.86);
    }

    72% {
        transform:
            scaleX(.18)
            scaleY(.93)
            translateX(-1%);

        opacity: .50;

        filter:
            brightness(.75);
    }

    84% {
        transform:
            scaleX(.055)
            scaleY(.90)
            translateX(0);

        opacity: 0;

        filter:
            brightness(.65);
    }

    100% {
        transform:
            scaleX(.02)
            scaleY(.88)
            translateX(0);

        opacity: 0;
    }
}


/* =========================================================
   BACK REVEAL
   ========================================================= */

.envelope-card.turning .envelope-back {

    animation:
        paperBackReveal
        1.45s
        .15s
        cubic-bezier(
            .76,
            0,
            .18,
            1
        )
        forwards;
}


@keyframes paperBackReveal {

    0% {
        transform:
            scaleX(.02)
            scaleY(.88);

        opacity: 0;
    }

    18% {
        transform:
            scaleX(.08)
            scaleY(.90);

        opacity: .05;
    }

    35% {
        transform:
            scaleX(.25)
            scaleY(.94);

        opacity: .18;
    }

    52% {
        transform:
            scaleX(.48)
            scaleY(.97);

        opacity: .48;
    }

    68% {
        transform:
            scaleX(.72)
            scaleY(.985);

        opacity: .82;
    }

    84% {
        transform:
            scaleX(.92)
            scaleY(.995);

        opacity: 1;
    }

    100% {
        transform:
            scaleX(1)
            scaleY(1);

        opacity: 1;
    }
}


/* =========================================================
   CENTER FOLD ANIMATION
   ========================================================= */

.envelope-card.turning .center-fold {

    animation:
        centerFoldAnimation
        1.45s
        ease
        forwards;
}


@keyframes centerFoldAnimation {

    0% {
        opacity: 0;
        transform:
            translateX(-50%)
            scaleY(0);
    }

    25% {
        opacity: .35;
        transform:
            translateX(-50%)
            scaleY(.35);
    }

    48% {
        opacity: .75;
        transform:
            translateX(-50%)
            scaleY(.72);
    }

    65% {
        opacity: .4;
        transform:
            translateX(-50%)
            scaleY(1);
    }

    100% {
        opacity: 0;
        transform:
            translateX(-50%)
            scaleY(1);
    }
}


/* =========================================================
   SHADOW ANIMATION
   ========================================================= */

.envelope-card.turning .turn-shadow {

    animation:
        movingShadow
        1.45s
        ease
        forwards;
}


@keyframes movingShadow {

    0% {
        opacity: 0;
        transform:
            translateX(-100%);
    }

    30% {
        opacity: .15;
        transform:
            translateX(-30%);
    }

    50% {
        opacity: .35;
        transform:
            translateX(0);
    }

    70% {
        opacity: .15;
        transform:
            translateX(30%);
    }

    100% {
        opacity: 0;
        transform:
            translateX(100%);
    }
}


/* =========================================================
   TURN BUTTON
   ========================================================= */

.turn-instruction {
    position: absolute;

    left: 50%;
    bottom: -78px;

    z-index: 100;

    transform:
        translateX(-50%);

    width: 100%;

    text-align: center;

    transition:
        opacity .5s ease;
}


.turn-button {

    border: none;

    background: transparent;

    color:
        rgba(255,235,235,.95);

    font-family: inherit;

    font-size: 15px;

    letter-spacing: 1.5px;

    cursor: pointer;

    padding:
        10px 20px;
}


.turn-button:active {
    transform:
        scale(.96);
}


.turn-arrow {

    display: block;

    margin-bottom: 4px;

    font-size: 25px;

    animation:
        bounce
        1.8s
        infinite;
}


/* =========================================================
   OPEN BUTTON
   ========================================================= */

.open-button-layer {

    position: absolute;

    left: 50%;
    top: 50%;

    z-index: 200;

    transform:
        translate(-50%, -50%);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .6s ease;
}


.open-button-layer.visible {

    opacity: 1;

    pointer-events: auto;
}


.open-button {

    border:
        1px solid
        rgba(255,255,255,.85);

    border-radius: 50px;

    padding:
        14px 38px;

    min-width: 135px;

    background:
        rgba(255,255,255,.17);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    color: white;

    font-family: inherit;

    font-size: 15px;

    letter-spacing: 3px;

    cursor: pointer;

    outline: none;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.25);

    transition:
        transform .25s ease,
        background .25s ease;
}


.open-button:hover {

    background:
        rgba(255,255,255,.32);

    transform:
        scale(1.07);
}


.open-button:active {

    transform:
        scale(.95);
}


/* =========================================================
   ENVELOPE LEAVES
   ========================================================= */

.envelope-scene.opening {

    opacity: 0;

    transform:
        scale(.72)
        translateY(30px);

    pointer-events: none;
}


/* =========================================================
   LETTER
   ========================================================= */

.paper-scene {

    position: fixed;

    inset: 0;

    z-index: 30;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;
}


.paper {

    position: relative;

    width:
        min(
            760px,
            88vw
        );

    height:
        min(
            650px,
            82vh
        );

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #fffdf2,
            #fff7dc
        );

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.65);

    opacity: 0;

    transform:
        translateY(180px)
        scaleY(.05);

    transform-origin:
        bottom center;

    pointer-events: auto;
}


.paper.unfold {

    animation:
        paperUnfold
        1.6s
        cubic-bezier(
            .16,
            1,
            .3,
            1
        )
        forwards;
}


@keyframes paperUnfold {

    0% {

        opacity: 0;

        transform:
            translateY(180px)
            scaleY(.05);
    }

    30% {

        opacity: 1;

        transform:
            translateY(90px)
            scaleY(.25);
    }

    60% {

        transform:
            translateY(35px)
            scaleY(.70);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scaleY(1);
    }
}


/* =========================================================
   PAPER BORDER
   ========================================================= */

.paper::before {

    content: "";

    position: absolute;

    inset: 11px;

    z-index: 10;

    border:
        1px solid
        rgba(110,70,45,.18);

    pointer-events: none;
}


/* =========================================================
   PAPER CONTENT
   ========================================================= */

.paper-content {

    position: relative;

    z-index: 5;

    width: 100%;
    height: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        48px
        clamp(
            30px,
            7vw,
            70px
        );

    color:
        #38251f;

    -webkit-overflow-scrolling:
        touch;

    scrollbar-width: thin;
}


.paper-content::-webkit-scrollbar {
    width: 6px;
}


.paper-content::-webkit-scrollbar-track {
    background:
        rgba(120,70,45,.08);
}


.paper-content::-webkit-scrollbar-thumb {
    background:
        rgba(120,70,45,.35);

    border-radius: 10px;
}


/* =========================================================
   LETTER HEADER
   ========================================================= */

.letter-header {

    text-align: center;

    margin-bottom: 38px;

    opacity: 0;
}


.paper.writing
.letter-header {

    animation:
        fadeUp
        1s
        .2s
        forwards;
}


.letter-small {

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 4px;

    color:
        #8c5746;

    margin-bottom: 12px;
}


.letter-header h1 {

    margin: 0;

    color:
        #801d2a;

    font-size:
        clamp(
            30px,
            6vw,
            50px
        );

    font-style: italic;

    font-weight: 500;
}


.letter-header p {

    margin-top: 10px;

    font-size: 15px;

    color:
        #765045;
}


/* =========================================================
   WRITEUP
   ========================================================= */

.writeup {

    position: relative;

    z-index: 20;

    max-width: 650px;

    margin: auto;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size:
        clamp(
            16px,
            2.15vw,
            19px
        );

    line-height:
        1.82;

    letter-spacing:
        .05px;
}


.write-paragraph {

    margin-bottom: 24px;

    visibility: hidden;
}


/* =========================================================
   TYPING CURSOR
   ========================================================= */

.write-paragraph.typing::after {

    content: "";

    display: inline-block;

    width: 2px;

    height: 1.15em;

    margin-left: 3px;

    vertical-align: -3px;

    background:
        #801d2a;

    animation:
        cursorBlink
        .7s
        infinite;
}


/* =========================================================
   FINAL LINE
   ========================================================= */

.final-line {

    margin-top: 30px;

    color:
        #801d2a;

    font-size: 20px;
}


/* =========================================================
   SIGNATURE
   ========================================================= */

.signature {

    margin-top: 35px;

    padding-bottom: 50px;

    text-align: right;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size: 23px;

    line-height: 1.7;

    color:
        #801d2a;

    opacity: 0;
}


.signature.show {

    animation:
        fadeUp
        1.2s
        forwards;
}


/* =========================================================
   FLOATING HEARTS
   ========================================================= */

.heart {

    position: fixed;

    z-index: 200;

    pointer-events: none;

    animation:
        floatHeart
        5s
        linear
        forwards;
}


@keyframes floatHeart {

    0% {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.5)
            rotate(0deg);
    }

    15% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-100vh)
            scale(1.3)
            rotate(25deg);
    }
}


/* =========================================================
   GENERAL ANIMATIONS
   ========================================================= */

@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(25px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes bounce {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(7px);
    }
}


@keyframes cursorBlink {

    0%,
    45% {
        opacity: 1;
    }

    46%,
    100% {
        opacity: 0;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .envelope-scene {

        transform: none !important;
    }


    .envelope-area {

        transform: none !important;
    }


    /*
       No 3D / rotation is used.
       The phone viewport stays completely fixed.
    */

    .envelope-card {

        transform: none !important;
    }


    .envelope-front {

        padding: 25px;
    }


    .front-small {

        font-size: 9px;

        letter-spacing: 2px;
    }


    .front-title {

        font-size: 28px;
    }


    .front-name {

        font-size: 16px;
    }


    .turn-instruction {

        bottom: -70px;
    }


    .turn-button {

        font-size: 13px;
    }


    .paper {

        width: 94vw;

        height: 90vh;
    }


    .paper-content {

        padding:
            40px 25px;
    }


    .writeup {

        font-size: 16px;

        line-height: 1.82;
    }


    .letter-header h1 {

        font-size: 34px;
    }


    .letter-header p {

        font-size: 13px;
    }


    .signature {

        font-size: 20px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
     ===================================================== -->

<div class="background"></div>


<!-- =====================================================
     ENVELOPE
     ===================================================== -->

<div
    class="envelope-scene"
    id="envelopeScene"
>

    <div
        class="envelope-area"
    >


        <div
            class="envelope-card"
            id="envelopeCard"
        >


            <!-- FRONT -->

            <div
                class="envelope-front"
            >

                <div
                    class="front-small"
                >
                    A little something for you...
                </div>


                <div
                    class="front-title"
                >

                    Happiest Birthday<br>

                    to the amazing

                    <span>
                        UX Lead
                    </span>

                </div>


                <div
                    class="front-name"
                >

                    Pranati Vahia
                    aka Panda

                    <span
                        class="panda"
                    >
                        🐼❤️
                    </span>

                </div>

            </div>


            <!-- BACK -->

            <div
                class="envelope-back"
            ></div>


            <!-- CENTER FOLD -->

            <div
                class="center-fold"
            ></div>


            <!-- MOVING SHADOW -->

            <div
                class="turn-shadow"
            ></div>


        </div>


        <!-- TURN INSTRUCTION -->

        <div
            class="turn-instruction"
            id="turnInstruction"
        >

            <button
                type="button"
                class="turn-button"
                id="turnButton"
            >

                <span
                    class="turn-arrow"
                >
                    ↓
                </span>

                Click here to turn
                & open the envelope

            </button>

        </div>


        <!-- OPEN BUTTON -->

        <div
            class="open-button-layer"
            id="openButtonLayer"
        >

            <button
                type="button"
                class="open-button"
                id="openButton"
            >

                OPEN

            </button>

        </div>


    </div>

</div>


<!-- =====================================================
     LETTER
     ===================================================== -->

<div
    class="paper-scene"
>

    <div
        class="paper"
        id="paper"
    >

        <div
            class="paper-content"
        >


            <!-- LETTER HEADER -->

            <header
                class="letter-header"
            >

                <div
                    class="letter-small"
                >
                    FOR MY PANDA 🐼
                </div>


                <h1>
                    Happiest Birthday ❤️
                </h1>


                <p>
                    To the amazing UX Lead,
                    Pranati Vahia aka Panda.
                </p>

            </header>


            <!-- WRITEUP -->

            <div
                class="writeup"
            >


                <div
                    class="write-paragraph"
                    data-text="Hey Panda — ❤️

Happiest 30th Birthday!

I know it might be a little difficult to accept that you are turning 30 and stepping into this new version of life — where there will be more responsibility, more management, more designing, lifestyle changes, fitness enthusiasm, a little more seriousness... and God knows what else!

But hey, don't stress too much."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Because you know you have Gaurav. 😎

And thank God that before 30, we met.

Because now, in your 30s, you are going to get married to me.

Cool, right? 😎😂"
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Though, as you know, I have a LOT to say.

From Haldiram and those tea-making times to today's Shozo...

This is us. ❤️

We have faced challenges, ups and downs, confusing moments, crazy moments and everything in between.

But somehow, through all of it, we still chose us."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="And luckily, we got what we wanted.

Especially you — you got what you wished for.

Although, technically, I am already the lucky one...

because I got you. ❤️"
                ></div>


                <div
                    class="write-paragraph"
                    data-text="So, koi kai b keh, kasu b ketlu pith pachhad, or modha na saame keh...

Don't stress. Don't get affected by all the negative things.

You know who you are.

You know your capabilities.

And I know them too."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Tane tari journey jaate shape kari che.

From Dev to UX, tu jaate chase karyu, jaate decisions lidha, ane pachhi ene prove pan karyu.

So no matter what people say, tane khabar che ke te shu achieve karyu che.

And I trust you.

Our manager trusts you.

Our families trust you.

LOS trusts you.

Then what else do you want?"
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Just be energetic.

Be what you are.

Hasta reh.

Because that smile... tara face par bau sari lage che, especially aa golu face par. 🥹❤️

You are a Lead, and the way you think about your department, the UX team, and the people working with you...

Seriously commendable."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="Letter ma bau nai lakhvu.

I genuinely tried my best ke aa vakhte kasu navu laavu.

Pan mara pase bolva bau badhu che.

And honestly, aa badhu already bau vaar kahi chukyo chu.

So, let's keep some things for the conversations, the fights, the trips, the random food plans, and all the years ahead."
                ></div>


                <div
                    class="write-paragraph"
                    data-text="But this one is special.

Just before our marriage, officially from your boyfriend...

One last 17th August.

And yes...

2026.

Because in 2027, I will be saying this officially as your husband.

:P"
                ></div>


                <div
                    class="write-paragraph"
                    data-text="So yes...

Please annoy me.

Gusse tha.

Irritate tha mara thi.

Mane sushi khavdaay.

Because hu have sathe hois. ❤️

And we still have so many trips to take, so many places to explore, so much food to eat, and so many memories to make.

So enjoy all of it."
                ></div>


                <div
                    class="write-paragraph final-line"
                    data-text="Enjoy your special day, cutie. ❤️

I am proud of you.

Always.

And I love you.

❤️"
                ></div>


            </div>


            <!-- SIGNATURE -->

            <div
                class="signature"
                id="signature"
            >

                Your boyfriend,

                <br>

                <b>
                    Gaurav aka Momo 🐼❤️
                </b>

            </div>


        </div>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const envelopeCard =
    document.getElementById(
        "envelopeCard"
    );

const turnButton =
    document.getElementById(
        "turnButton"
    );

const openButton =
    document.getElementById(
        "openButton"
    );

const openButtonLayer =
    document.getElementById(
        "openButtonLayer"
    );

const envelopeScene =
    document.getElementById(
        "envelopeScene"
    );

const turnInstruction =
    document.getElementById(
        "turnInstruction"
    );

const paper =
    document.getElementById(
        "paper"
    );

const paragraphs =
    document.querySelectorAll(
        ".write-paragraph"
    );

const signature =
    document.getElementById(
        "signature"
    );


let envelopeTurned = false;

let envelopeOpened = false;


/* =========================================================
   TURN ENVELOPE
   ========================================================= */

turnButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        if (envelopeTurned) {
            return;
        }

        envelopeTurned = true;


        /*
           Start synchronized paper-fold animation.
        */

        envelopeCard.classList.add(
            "turning"
        );


        /*
           Hide instruction.
        */

        turnInstruction.style.opacity =
            "0";

        turnInstruction.style.pointerEvents =
            "none";


        /*
           Wait until back has completely
           appeared before showing OPEN.
        */

        setTimeout(
            function() {

                openButtonLayer.classList.add(
                    "visible"
                );

            },
            1650
        );

    }
);


/* =========================================================
   OPEN ENVELOPE
   ========================================================= */

openButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        if (!envelopeTurned) {
            return;
        }

        if (envelopeOpened) {
            return;
        }

        envelopeOpened = true;


        openButtonLayer.classList.remove(
            "visible"
        );

        openButtonLayer.style.pointerEvents =
            "none";


        /*
           Envelope disappears.
        */

        envelopeScene.classList.add(
            "opening"
        );


        /*
           Letter unfolds.
        */

        setTimeout(
            function() {

                paper.classList.add(
                    "unfold"
                );

            },
            450
        );


        /*
           Start writing.
        */

        setTimeout(
            function() {

                paper.classList.add(
                    "writing"
                );

                startWriting();

                createHearts();

            },
            2000
        );

    }
);


/* =========================================================
   WRITING ANIMATION
   ========================================================= */

async function startWriting() {

    await sleep(700);


    for (
        let i = 0;
        i < paragraphs.length;
        i++
    ) {

        await typeParagraph(
            paragraphs[i]
        );

        await sleep(650);

    }


    signature.classList.add(
        "show"
    );

}


/* =========================================================
   TYPE PARAGRAPH
   ========================================================= */

function typeParagraph(element) {

    return new Promise(
        function(resolve) {

            const text =
                element.dataset.text;


            element.style.visibility =
                "visible";


            element.classList.add(
                "typing"
            );


            let index = 0;


            function writeCharacter() {

                if (
                    index >=
                    text.length
                ) {

                    element.classList.remove(
                        "typing"
                    );

                    resolve();

                    return;
                }


                const character =
                    text[index];


                if (
                    character ===
                    "\n"
                ) {

                    element.innerHTML +=
                        "<br>";

                } else {

                    element.textContent +=
                        character;

                }


                index++;


                /*
                   Typing speed.
                */

                let delay = 25;


                if (
                    character === " "
                ) {

                    delay = 8;

                }


                /*
                   Small pauses after punctuation.
                */

                if (
                    character === "." ||
                    character === "," ||
                    character === "!" ||
                    character === "?" ||
                    character === "—"
                ) {

                    delay = 130;

                }


                setTimeout(
                    writeCharacter,
                    delay
                );

            }


            writeCharacter();

        }
    );

}


/* =========================================================
   SLEEP
   ========================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   HEARTS
   ========================================================= */

function createHearts() {

    const symbols = [

        "❤️",
        "💕",
        "💗",
        "✨",
        "🌸",
        "🐼"

    ];


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        setTimeout(
            function() {

                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "heart";


                heart.textContent =
                    symbols[
                        Math.floor(
                            Math.random()
                            *
                            symbols.length
                        )
                    ];


                heart.style.left =
                    Math.random()
                    *
                    100
                    +
                    "vw";


                heart.style.bottom =
                    "-30px";


                heart.style.fontSize =
                    (
                        14 +
                        Math.random() * 18
                    )
                    +
                    "px";


                heart.style.animationDuration =
                    (
                        4 +
                        Math.random() * 3
                    )
                    +
                    "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    function() {

                        heart.remove();

                    },
                    7000
                );


            },
            i * 180
        );

    }

}

</script>
